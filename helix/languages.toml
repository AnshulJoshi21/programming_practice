[[language]]
name = "c"
file-types = ["c", "h"]
indent = { tab-width = 4, unit = "    " }
formatter = { command = "clang-format"}
auto-format = true

[[language]]
name = "cpp"
file-types = ["cpp", "cc", "cxx", "hpp", "hcc", "hxx"]
indent = { tab-width = 4, unit = "    " }
formatter = { command = "clang-format"}
auto-format = true

[language-server.clangd]
command = "clangd"
args = [
  "--header-insertion=never",
  "--function-arg-placeholders=0",
]

[[language]]
name = "python"
# We use a shell (sh) to string together the import sort and the format
formatter = { command = "sh", args = ["-c", "ruff check --select I --fix - | ruff format -"] }
auto-format = true
language-servers = ["basedpyright", "ruff"]

[language-server.pylsp.config.pylsp.plugins]
# Disable the plugins that cause the > 79 character warnings
pycodestyle = { enabled = false }
mccabe = { enabled = false }
pyflakes = { enabled = false }
# Keep your mypy settings
pylsp_mypy = { enabled = true, live_mode = true }

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.basedpyright.config.python.analysis]
# This tells Pyright to look in your project's 'typings' folder
# choose main folder: ex: python_files
stubPath = "typings"
typeCheckingMode = "standard"

# stop autoimports
autoImportCompletions = false

[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }
language-servers = ["gopls"]

[[language]]
name = "html"
language-servers = [{ name = "superhtml", except-features = ["format"] }, "vscode-html-language-server"]
auto-format = true
