<!doctype html>
<html>
  <head>
    <title>Login</title>
  </head>

  <body>
    <form method="POST">
      <h2>Enter username:</h2>
      <input type="text" name="username" placeholder="enter name" />

      <h2>Enter password:</h2>
      <input type="text" name="password" placeholder="enter age" />

      <br /><br /><br />
      <button type="submit">Submit</button>
    </form>

    {% if result %}
      <h2>{{result}}</h2>
    {% endif %}

  </body>
</html>
