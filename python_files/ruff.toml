# Target version for Python (e.g., "py310", "py312")
target-version = "py312"

# Set the line length to your preferred 79 characters
line-length = 79

[lint]
# 1. Enable a standard set of rules
# E/W: pycodestyle (standard PEP8)
# F: Pyflakes (logic errors)
# I: isort (import sorting)
# B: flake8-bugbear (common design flaws)
# C90: mccabe (complexity check)
select = ["E", "W", "F", "I", "B", "C90"]

# 2. Specifically ignore rules if they are too annoying
ignore = [
    "E501", # Ignore line-length violations (let the formatter handle it)
    "B008", # Allow function calls in default arguments (useful for FastAPI/Click)
]

# 3. Configure the "isort" import sorter
[lint.isort]
combine-as-imports = true
force-single-line = false

# 4. Configure the Formatter
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.mccabe]
# Flag functions with a complexity score higher than 10
max-complexity = 10
